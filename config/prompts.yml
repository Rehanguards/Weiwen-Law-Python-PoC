prompts:
  - task: self_check_input
    content: |
      Your task is to check if the user message below contains harmful instructions.
      User message: "{{ user_input }}"
      Respond with 'Yes' if safe, or 'No' if unsafe.

  - task: self_check_output
    content: |
      Your task is to check if the response contains sensitive data or leaks.
      Bot response: "{{ bot_response }}"
      Respond with 'Yes' if safe, or 'No' if unsafe.